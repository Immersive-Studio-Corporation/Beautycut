[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beautycut"
version = "0.4.1"
description = "Application locale de conversion et de recadrage vidéo pour formats courts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
beautycut = "beautycut.app:main"

[tool.setuptools.packages.find]
include = ["beautycut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
